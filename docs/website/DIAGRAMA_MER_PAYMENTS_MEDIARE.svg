<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 1120" role="img" aria-labelledby="mer-payments-title mer-payments-desc">
<title id="mer-payments-title">MER · Cotações, obrigações e pagamentos simulados</title><desc id="mer-payments-desc">Entidades relacionais com chaves e cardinalidades. As setas seguem da entidade referenciada para a dependente; campos e relações completas estão no dicionário da seção 19E.</desc>
