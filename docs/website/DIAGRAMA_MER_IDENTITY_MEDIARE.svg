<title id="mer-identity-title">MER · Identidade, autenticação e habilitação</title><desc id="mer-identity-desc">Entidades relacionais com chaves e cardinalidades. As setas seguem da entidade referenciada para a dependente; campos e relações completas estão no dicionário da seção 19E.</desc>
