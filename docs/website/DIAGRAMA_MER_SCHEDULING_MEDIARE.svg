<title id="mer-scheduling-title">MER · Rodadas, escolhas e videoconferência</title><desc id="mer-scheduling-desc">Entidades relacionais com chaves e cardinalidades. As setas seguem da entidade referenciada para a dependente; campos e relações completas estão no dicionário da seção 19E.</desc>
