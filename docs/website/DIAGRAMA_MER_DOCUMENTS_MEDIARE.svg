<title id="mer-documents-title">MER · Manifestações, documentos e processamento</title><desc id="mer-documents-desc">Entidades relacionais com chaves e cardinalidades. As setas seguem da entidade referenciada para a dependente; campos e relações completas estão no dicionário da seção 19E.</desc>
