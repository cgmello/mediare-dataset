<text x="40" y="1082" font-family="Arial" font-size="16" fill="#536570">Seta: entidade referenciada → dependente. Rótulo: cardinalidade na origem → cardinalidade no destino.</text><text x="40" y="1106" font-family="Arial" font-size="16" fill="#536570">Visão parcial do mesmo modelo; entidades repetidas são a mesma tabela. FKs secundárias constam no dicionário.</text></svg>