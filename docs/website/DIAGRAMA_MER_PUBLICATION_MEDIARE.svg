<title id="mer-publication-title">MER · Snapshots, publicação e comitê</title><desc id="mer-publication-desc">Entidades relacionais com chaves e cardinalidades. As setas seguem da entidade referenciada para a dependente; campos e relações completas estão no dicionário da seção 19E.</desc>
